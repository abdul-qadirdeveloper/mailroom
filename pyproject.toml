[project]
name = "mailroom"
version = "0.1.0"
description = "A small newsletter tool: count subscribers, check an issue, send it to a practice mail server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mailroom = "mailroom:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
